# The duck's own eyes: `mediad` pushes camera frames to a VLM on this board.
#
# **This is a bypass, not a second pipeline.** `--stream-to` taps the tee *after* `jpeg_encoder` -
# the same branch the console's video comes off - so the encoder runs once, the Argus session stays
# single, and the console keeps working exactly as before. The consumer is
# `scripts/duck-vision.py` (see `docs/project/duck-vision.md`), which posts the newest frame to the
# local llama.cpp server and logs a caption. A receiver that is down is redialled by the stream pump
# and a refusal to start is a warning in the log, never a failed daemon: the video is the point and
# the model is a passenger (`mediad/src/main.rs`, and `mediad/src/stream.rs` behind it).
#
# Why flags rather than `[media]` keys: `[media]` is what the stream *looks like* (source, size,
# rate, bitrate) and `robotctl configure` edits it; where the frames *go* is not a robot property, so
# it is an argument. `--rotate` is here for the same reason it is in `20-mount.conf`.
#
# **This file owns the command line.** Both drop-ins set `ExecStart`, and for a single-valued
# setting systemd honours the one in the file that sorts last - so `20-mount.conf`'s line is
# superseded by this one, and the mount angle has to be repeated here. If the mount angle changes,
# change it **here** (`--rotate`, and the rationale in `20-mount.conf` is still the explanation).
#
# Installing it: `scripts/deploy-jetson-skeleton.sh` (which copies 10-, 20- and 30- together), or by
# hand to /etc/systemd/system/mediad.service.d/30-stream.conf followed by `systemctl daemon-reload`
# and `systemctl restart mediad`. Check what the daemon actually got with
# `systemctl show mediad -p ExecStart` before believing the file. Verify with
# `sudo cat /run/mediad/camera.json` (the console's own meter must still read `fps` at target with
# `dropped` not climbing) *and* a caption in `journalctl --user -u duck-vision`.
[Service]
ExecStart=
ExecStart=/opt/robot/daemon/current/bin/mediad --rotate 0 --stream-to ws://127.0.0.1:8765/frames --stream-fps 1 --stream-longest 640 --stream-quality 70
