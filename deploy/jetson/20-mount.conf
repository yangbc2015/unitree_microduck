# The head camera on this rig is mounted square to the world; upstream's default is a quarter turn.
#
# **`mediad` does not rotate pixels.** It tells every consumer how far the camera is mounted off
# upright and they turn the picture for free - `main.rs`'s `--rotate`, "there is one default and it
# is the robot's", and that default is 90, which is the Radxa's mount. On this board the Arducam
# IMX219 sits square in its bracket, so the default has the console rotate a *correct* picture a
# quarter turn. The video arrives, and it arrives lying on its side, with the console saying so:
#
#     video 1280x720, camera mounted 90° off upright      <- the console's own drawer log
#
# `--rotate` has no `[media]` key: the mount is a fact about the hardware rather than a setting, and
# `robotctl configure` deliberately does not offer it. So this is an `ExecStart` override, and it has
# to repeat the whole command line - a future unit that passes arguments has to be merged in here.
# `20-` rather than `10-`, so it reads after the Argus socket drop-in beside it.
#
# Installing it: `scripts/deploy-jetson-skeleton.sh`, or by hand to
# /etc/systemd/system/mediad.service.d/20-mount.conf followed by `systemctl daemon-reload` and a
# restart of mediad.
[Service]
ExecStart=
ExecStart=/opt/robot/daemon/current/bin/mediad --rotate 0
