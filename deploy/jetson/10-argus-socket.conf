# Argus keeps its socket in /tmp, and this unit has a private /tmp.
#
# `PrivateTmp=yes` is upstream's and it is right - mediad parses network input for a living. What it
# also does on this board is hide `/tmp/argus_socket`, where `nvargus-daemon` listens, so
# `nvarguscamerasrc` cannot reach the daemon and there is no video at all:
#
#     (Argus) Error 0x00030003: Connecting to nvargus-daemon failed: No such file or directory
#     Error generated. gstnvarguscamerasrc.cpp, execute:940 Failed to create CameraProvider
#
# The session still comes up and the signalling port still listens, so a browser connects and the
# picture never arrives: the failure reads as a WebRTC problem and is a mount namespace one.
# `lsof /dev/video0` is what tells them apart - with the socket hidden, nothing holds the camera.
#
# Binds the one socket in rather than giving up the private /tmp. `After=` because a bind needs its
# path to exist: if `nvargus-daemon` restarts, this mount goes stale and mediad has to be restarted
# with it, which is why it is a dependency and not only a mount.
#
# Installed by scripts/deploy-jetson-skeleton.sh, to
# /etc/systemd/system/mediad.service.d/10-argus-socket.conf - a drop-in rather than an edit to
# mediad/systemd/mediad.service, so the upstream unit stays byte-for-byte what upstream ships.
[Unit]
After=nvargus-daemon.service

[Service]
BindPaths=/tmp/argus_socket
